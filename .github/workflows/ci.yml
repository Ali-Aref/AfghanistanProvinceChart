name: CI

on:
  push:
    branches:
      - dev
      - production
  pull_request:
    branches:
      - dev
      - production

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and component tests
        run: pnpm test

      - name: Validate geography
        run: pnpm data:validate

      - name: Build packages
        run: pnpm build

      - name: Verify package output
        run: pnpm package:check

      - name: Pack tarball
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.artifacts"
          pnpm --filter afghanistan-province-chart pack --pack-destination "$GITHUB_WORKSPACE/.artifacts"
          tar -tzf "$GITHUB_WORKSPACE"/.artifacts/*.tgz

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-node-${{ matrix.node }}
          path: .artifacts/*.tgz
          if-no-files-found: error

  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        run: pnpm build

      - name: Playwright tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
